# ============================================
# Production Profile (MySQL database)
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
# ============================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mts_prod
    username: root
    password: yourpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Disable H2 console in production
  h2:
    console:
      enabled: false

  # Don't auto-load data.sql in production
  sql:
    init:
      mode: never

logging:
  level:
    com.mts: INFO
    org.springframework.web: WARN
