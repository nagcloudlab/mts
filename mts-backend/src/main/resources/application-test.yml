# ============================================
# Test Profile (H2 in-memory, same as default but with test-specific tweaks)
# Activated automatically by @ActiveProfiles("test")
# ============================================
spring:
  datasource:
    url: jdbc:h2:mem:mts_test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: false

  # Don't load data.sql in tests - tests create their own data
  sql:
    init:
      mode: never

mts:
  notification-service:
    url: http://localhost:3000
